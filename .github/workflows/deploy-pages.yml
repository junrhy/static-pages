name: Deploy Static Pages to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rily-architects-3d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: rily-architects-3d/package-lock.json

      - name: Install Dependencies (Ri-Ly 3D)
        working-directory: ./rily-architects-3d
        run: npm ci

      - name: Build Project (Ri-Ly 3D)
        working-directory: ./rily-architects-3d
        run: npm run build

      - name: Install Dependencies (Dental 3D)
        working-directory: ./dental
        run: npm ci

      - name: Build Project (Dental 3D)
        working-directory: ./dental
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble Site
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p _site
          # Copy all static directories into _site, excluding git, github configs, and node/build sources
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='rily-architects-3d' --exclude='dental' ./ _site/
          # Copy built dists
          mkdir -p _site/rily-architects-3d
          cp -R rily-architects-3d/dist/. _site/rily-architects-3d/
          mkdir -p _site/dental
          cp -R dental/dist/. _site/dental/
          # Add .nojekyll so files/folders starting with underscores or special names are preserved
          touch _site/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
