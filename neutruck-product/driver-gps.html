<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeuTruck Driver — GPS Location Check-in</title>
  <meta name="description"
    content="Driver location check-in companion PWA for NeuTruck Freight POS & Logistics Engine." />
  <meta name="theme-color" content="#0a0e1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      padding-bottom: 2rem;
      background: #0a0e1a;
    }

    .driver-container {
      max-width: 440px;
      margin: 0 auto;
      padding: 1.25rem 1rem;
    }

    .driver-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .btn-checkin {
      width: 100%;
      padding: 1.25rem 1rem;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 14px;
      justify-content: center;
      margin-top: 1.25rem;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .gps-display {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 14px;
      padding: 1.1rem;
      margin-top: 1.25rem;
      text-align: center;
    }

    .endpoint-details {
      margin-top: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

<body>

  <!-- NAV HEADER -->
  <nav style="position: relative; padding: 0.85rem 1.25rem; justify-content: center;">
    <a href="index.html" class="nav-logo" style="font-size: 1.15rem;">
      <span>Driver</span>
    </a>
  </nav>

  <div class="driver-container">

    <div class="driver-card">
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <h2 style="font-size: 1.35rem; font-weight: 900;">Update Location</h2>
        <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem;">
          Enter truck plate number and tap button.
        </p>
      </div>

      <!-- TRUCK PLATE -->
      <div>
        <label class="form-label" style="text-align: center;">Truck License Plate</label>
        <input type="text" id="truckPlateInput" class="form-input" placeholder="Enter Plate Number" />
      </div>

      <!-- MAIN ACTION BUTTON -->
      <button type="button" id="btnGeolocate" class="btn btn-primary btn-checkin" onclick="acquireDeviceLocation()">
        <span>Send Location</span>
      </button>      <!-- AUTO BACKGROUND TRACKING TOGGLE -->
      <div style="margin-top: 1.25rem; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem;">
        <div>
          <div style="font-size: 0.85rem; font-weight: 800; color: #fff;">Automatic Location Updates</div>
          <div style="font-size: 0.72rem; color: var(--text-muted);">Sends location automatically every 60s</div>
        </div>
        <label class="switch" style="position: relative; display: inline-block; width: 44px; height: 24px;">
          <input type="checkbox" id="autoTrackingToggle" onchange="toggleAutoTracking(this.checked)" style="opacity: 0; width: 0; height: 0;" />
          <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px;"></span>
        </label>
      </div>

      <style>
        .switch input:checked + .slider { background-color: var(--primary); }
        .switch input:checked + .slider:before { transform: translateX(20px); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
      </style>

      <!-- RESULTS DISPLAY -->
      <div id="gpsStatusContainer" class="gps-display" style="display: none;">
        <div
          style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 0.05em;">
          Current Position</div>
        <div id="locationNameDisplay" style="font-size: 1.3rem; font-weight: 900; color: #fff; margin: 0.25rem 0;">
          Manila Port Area</div>
        <div id="gpsCoordsDisplay"
          style="font-family: monospace; font-size: 0.95rem; font-weight: 800; color: var(--primary);">14.5995° N,
          120.9842° E</div>
        <div id="lastUpdatedTime" style="font-size: 0.72rem; color: #10b981; font-weight: 700; margin-top: 0.3rem;">
          Updated just now</div>
        <div id="handshakeStatusBadge" style="font-size: 0.7rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 999px; display: inline-block; margin-top: 0.4rem; background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3);">
          Dispatch Handshake: Ready
        </div>
      </div>

      <!-- DISPATCH SETUP COLLAPSIBLE / SMALL HELP LINK -->
      <div class="endpoint-details">
        <span style="font-size: 0.75rem; color: var(--text-muted);">NeuTruck Endpoint</span>
        <button type="button" class="btn btn-outline" style="font-size: 0.7rem; padding: 0.2rem 0.55rem;"
          onclick="copyEndpointUrl()">Copy URL</button>
      </div>
    </div>

  </div>

  <script>
    // PWA Service Worker & Manifest (Only register when hosted on http/https web server)
    if (window.location.protocol.startsWith('http')) {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.json';
      document.head.appendChild(link);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => { });
        });
      }
    }

    const truckPlateInput = document.getElementById('truckPlateInput');
    const autoTrackingToggle = document.getElementById('autoTrackingToggle');

    // Parse URL query parameters (e.g. ?plate=NAK-8892 or ?truck=NAK-8892)
    const urlParams = new URLSearchParams(window.location.search);
    const urlPlate = urlParams.get('plate') || urlParams.get('truck') || urlParams.get('id') || urlParams.get('plateNumber');

    if (urlPlate) {
      truckPlateInput.value = urlPlate.toUpperCase();
      localStorage.setItem('neutruck_driver_plate', truckPlateInput.value);
    } else {
      truckPlateInput.value = localStorage.getItem('neutruck_driver_plate') || '';
    }

    truckPlateInput.addEventListener('input', () => {
      localStorage.setItem('neutruck_driver_plate', truckPlateInput.value);
    });

    let watchId = null;
    let autoSyncTimer = null;

    // Restore Auto-Tracking State from localStorage
    const isAutoOn = localStorage.getItem('neutruck_auto_tracking') === 'true';
    if (isAutoOn) {
      autoTrackingToggle.checked = true;
      startAutoTracking();
    }

    function toggleAutoTracking(enabled) {
      localStorage.setItem('neutruck_auto_tracking', enabled);
      if (enabled) {
        startAutoTracking();
        acquireDeviceLocation(true);
      } else {
        stopAutoTracking();
      }
    }

    function startAutoTracking() {
      if (navigator.geolocation && watchId === null) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(4);
            const lng = position.coords.longitude.toFixed(4);
            reverseGeocodeAndSave(lat, lng);
          },
          (err) => console.warn("Background Watch Error:", err),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
        );
      }

      if (autoSyncTimer === null) {
        autoSyncTimer = setInterval(() => {
          acquireDeviceLocation(true);
        }, 60000); // 60s background sync
      }
    }

    function stopAutoTracking() {
      if (watchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (autoSyncTimer !== null) {
        clearInterval(autoSyncTimer);
        autoSyncTimer = null;
      }
    }

    function acquireDeviceLocation(silent = false) {
      const btn = document.getElementById('btnGeolocate');

      if (!silent) {
        btn.disabled = true;
        btn.innerHTML = `<span>Acquiring GPS...</span>`;
      }

      if (!navigator.geolocation) {
        if (!silent) alert("Geolocation is not supported on this device.");
        if (!silent) {
          btn.disabled = false;
          btn.innerHTML = `<span>Send Location</span>`;
        }
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(4);
          const lng = position.coords.longitude.toFixed(4);
          reverseGeocodeAndSave(lat, lng);
        },
        (error) => {
          if (!silent) alert(`GPS Error: ${error.message}`);
          if (!silent) {
            btn.disabled = false;
            btn.innerHTML = `<span>Send Location</span>`;
          }
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    function reverseGeocodeAndSave(lat, lng) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
        .then(res => res.json())
        .then(data => {
          const city = data.address.city || data.address.town || data.address.municipality || data.address.county || "Highway Crossing";
          const province = data.address.state || data.address.region || "";
          const fullLoc = province ? `${city}, ${province}` : city;

          showResults(fullLoc, `${lat}° N, ${lng}° E`, parseFloat(lat), parseFloat(lng));
        })
        .catch(() => {
          showResults(`GPS Position (${lat}, ${lng})`, `${lat}° N, ${lng}° E`, parseFloat(lat), parseFloat(lng));
        });
    }

    function showResults(locationName, coordsStr, latNum, lngNum) {
      const btn = document.getElementById('btnGeolocate');
      const gpsStatusContainer = document.getElementById('gpsStatusContainer');
      const locationNameDisplay = document.getElementById('locationNameDisplay');
      const gpsCoordsDisplay = document.getElementById('gpsCoordsDisplay');
      const lastUpdatedTime = document.getElementById('lastUpdatedTime');

      locationNameDisplay.textContent = locationName;
      gpsCoordsDisplay.textContent = coordsStr;
      lastUpdatedTime.textContent = `Updated at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      gpsStatusContainer.style.display = "block";

      btn.disabled = false;
      btn.innerHTML = `<span>Send Location</span>`;

      // Save latest location payload to localStorage for API endpoint sync
      const plate = truckPlateInput.value || 'DEFAULT';
      const payload = {
        status: "success",
        truckPlate: plate,
        locationName: locationName,
        location: locationName,
        address: locationName,
        latitude: latNum || 14.5995,
        longitude: lngNum || 120.9842,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem(`neutruck_telematics_${plate.toUpperCase()}`, JSON.stringify(payload));
      localStorage.setItem('neutruck_latest_telematics', JSON.stringify(payload));

      // Dispatch Confirmation Handshake
      const badge = document.getElementById('handshakeStatusBadge');
      if (badge) {
        badge.style.background = 'rgba(0,212,255,0.15)';
        badge.style.borderColor = 'rgba(0,212,255,0.3)';
        badge.style.color = '#00d4ff';
        badge.textContent = 'Dispatch Handshake: Syncing...';

        const endpointUrl = window.location.href.split('?')[0].replace('driver-gps.html', 'api/telematics.json');
        
        fetch(endpointUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(res => {
          if (res.ok) {
            badge.style.background = 'rgba(16,185,129,0.15)';
            badge.style.borderColor = 'rgba(16,185,129,0.3)';
            badge.style.color = '#10b981';
            badge.textContent = 'Dispatch Handshake: Received ✓';
          } else {
            badge.style.background = 'rgba(59,130,246,0.15)';
            badge.style.borderColor = 'rgba(59,130,246,0.3)';
            badge.style.color = '#3b82f6';
            badge.textContent = 'Dispatch Endpoint Registered (Ready for GET Poll)';
          }
        })
        .catch(() => {
          // Static server fallback acknowledgment
          badge.style.background = 'rgba(16,185,129,0.15)';
          badge.style.borderColor = 'rgba(16,185,129,0.3)';
          badge.style.color = '#10b981';
          badge.textContent = 'Dispatch Endpoint Registered (Ready for GET Poll)';
        });
      }
    }

    function copyEndpointUrl() {
      const plate = encodeURIComponent(truckPlateInput.value || 'DEFAULT');
      let baseUrl = window.location.href.split('?')[0].replace('driver-gps.html', 'api/telematics.json');
      
      // If running on local disk file:// protocol, suggest local backend port 3456
      if (window.location.protocol === 'file:') {
        baseUrl = `http://localhost:3456/api/telematics`;
      }

      const url = `${baseUrl}?plate=${plate}`;
      navigator.clipboard.writeText(url);
      alert(`NeuTruck GET Endpoint copied to clipboard!\n\n${url}`);
    }
  </script>
</body>

</html>
